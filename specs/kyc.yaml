# Application specification — KYC Review Queue (spec_version 1)
# Validated by `python -m app.cli validate-spec specs/kyc.yaml` (schema: backend/app/core/spec.py).
# Implemented by Devin following .agents/skills/create-internal-tool/SKILL.md; conventions in AGENTS.md.
# Sections business_rules / api / seed_data / non_goals / devin_notes are free-form and interpreted by Devin.

spec_version: 1

app:
  id: kyc
  name: KYC Review Queue
  category: review_queue
  console: Fintech Operations Console
  purpose: >
    Give compliance reviewers a single queue of customer identity-verification (KYC) cases,
    let them inspect synthetic verification findings, and record an approve / reject / escalate
    decision with a mandatory reason and a durable audit trail.
  users: [Compliance reviewers, Compliance leads (read-only oversight)]
  data_policy: Synthetic records only. No real identity documents or PII.

roles:
  - id: reviewer
    description: Can view all cases and perform review actions.
    can: [view, act]
  - id: viewer
    description: Read-only. Can view cases and history but cannot modify anything.
    can: [view]
roles_note: >
  Roles come from the DEV-ONLY simulated persona header (X-Demo-User). This is not authentication.
  See AGENTS.md "Authorization".

entities:
  - id: kyc_case
    name: KYC case
    id_field: id
    fields:
      - { name: id, type: string, label: Case ID, required: true, searchable: true }
      - { name: customer_name, type: string, label: Customer, required: true, searchable: true }
      - { name: customer_email, type: email, label: Email, required: true }
      - { name: country, type: string, label: Country, required: true, description: ISO-3166 alpha-2 }
      - { name: account_type, type: enum, label: Account type, options: [individual, business], required: true }
      - { name: risk_level, type: enum, label: Risk level, options: [low, medium, high], required: true, filterable: true }
      - { name: status, type: enum, label: Status, options: [pending, approved, rejected, escalated], required: true, filterable: true }
      - { name: submitted_at, type: datetime, label: Submitted, required: true }
      - { name: updated_at, type: datetime, label: Last updated, required: true }
      - { name: assigned_reviewer, type: string, label: Assigned reviewer, description: persona id or null }
      - { name: findings, type: json, label: Verification findings, description: "list of {check, result in [pass, warn, fail], detail}" }

views:
  list:
    entity: kyc_case
    columns: [id, customer_name, risk_level, status, submitted_at, assigned_reviewer, updated_at]
    search_fields: [customer_name, id]
    filters: [status, risk_level]
    default_sort: { field: submitted_at, direction: desc }
  detail:
    entity: kyc_case
    sections:
      - { title: Customer summary, fields: [customer_email, country, account_type, submitted_at, assigned_reviewer, updated_at] }
      - { title: Verification findings, fields: [findings] }
      - { title: Review history, source: audit }

forms: []   # no editable fields in the prototype; decisions are workflow actions

workflow:
  entity: kyc_case
  state_field: status
  states: [pending, approved, rejected, escalated]
  initial: pending
  terminal: [approved, rejected]
  actions:
    - { id: approve,  label: Approve,  from: [pending, escalated], to: approved,  roles: [reviewer], requires_reason: true }
    - { id: reject,   label: Reject,   from: [pending, escalated], to: rejected,  roles: [reviewer], requires_reason: true }
    - { id: escalate, label: Escalate, from: [pending],            to: escalated, roles: [reviewer], requires_reason: true }

audit:
  enabled: true
  record: [actor, previous_value, new_value, reason, timestamp]

# ---- free-form sections (interpreted by Devin, not validated) ----------------------------------

business_rules:
  - { id: BR-1, rule: Every review action requires a non-empty reason (after trimming whitespace)., on_violation: 422 validation_error }
  - { id: BR-2, rule: Only transitions listed in workflow.actions are allowed., on_violation: 409 invalid_transition }
  - { id: BR-3, rule: Only personas with role `reviewer` may perform review actions., on_violation: 403 forbidden }
  - { id: BR-4, rule: Status update and audit insert happen in the same database transaction; the transition check happens inside it. }
  - { id: BR-5, rule: Unknown case ids return 404 not_found. }
  - { id: BR-6, rule: All rules are enforced by the backend; the frontend may hide controls but is never the only guard. }

api:
  base_path: /api/kyc
  endpoints:
    - { method: GET,  path: /cases, query: "q (name or id substring), status, risk_level", response: "{ items: [KycCaseSummary], total }" }
    - { method: GET,  path: "/cases/{case_id}", response: "KycCaseDetail (summary + findings + audit_events newest first + allowed_actions)" }
    - { method: POST, path: "/cases/{case_id}/actions", body: "{ action, reason }", auth: role reviewer, errors: [404, 403, 409, 422] }
    - { method: GET,  path: /meta, response: "{ statuses, risk_levels, actions, transitions }" }

seed_data:
  count: 24
  distribution: { status: { pending: 12, escalated: 4, approved: 5, rejected: 3 }, risk_level: mixed }
  requirements:
    - deterministic so the demo is repeatable
    - non-pending cases ship with at least one historical audit event
    - findings mix pass / warn / fail correlated with risk level

acceptance_criteria:
  - { id: AC-1, given: seeded database, when: GET /api/kyc/cases, then: returns all 24 cases with summary fields }
  - { id: AC-2, when: "GET /cases?status=pending&risk_level=high, or ?q=<name fragment>", then: only matching cases are returned }
  - { id: AC-3, given: a pending case and a reviewer persona, when: POST approve with a reason, then: "200, status approved, updated_at changed" }
  - { id: AC-4, given: an approved case, when: POST any action, then: 409 invalid_transition and the case is unchanged }
  - { id: AC-5, given: a pending case, when: POST approve with an empty or whitespace reason, then: 422 validation_error and the case is unchanged }
  - { id: AC-6, given: a review action succeeded, when: the database is reopened (new connection / app restart), then: the new status is still present }
  - { id: AC-7, given: a review action succeeded, then: "exactly one new audit event exists with previous_status, new_status, actor, reason, timestamp" }
  - { id: AC-8, given: viewer persona, when: POST any action, then: 403 forbidden and the case is unchanged }
  - { id: AC-9, given: escalated case and reviewer persona, when: POST approve or reject, then: 200 and the terminal status is set }
  - { id: AC-10, kind: browser, then: "queue loads, filters work, detail opens, approve-with-reason persists across refresh, audit entry shown, viewer sees no action buttons and the backend rejects a forced request" }

non_goals:
  - real identity provider or SSO
  - real KYC vendor integration or document storage
  - case assignment / re-assignment workflow
  - pagination (24 records)
